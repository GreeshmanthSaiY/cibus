name: Production Release Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  production-gate:
    name: Production Release Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Complete Quality & Route Probe Suite
        run: |
          node --test tests/unit/*.test.js
          node tests/integration/html-integrity.test.js
          node tests/integration/server-probe.js

      - name: Validate Production Vercel & Architecture Configuration
        run: node scripts/verify-build.js

      - name: Production Release Gate Sign-off
        run: echo "Production release gate passed successfully."
