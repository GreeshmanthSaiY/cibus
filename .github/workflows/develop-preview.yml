name: Develop Staging & Preview Check

on:
  push:
    branches: [ develop ]

jobs:
  preview-check:
    name: Staging Preview Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Integrity Suite
        run: |
          node --test tests/unit/*.test.js
          node tests/integration/html-integrity.test.js

      - name: Verify Vercel Configuration
        run: |
          node -e "const v = require('./vercel.json'); if (!v.routes || !v.headers) process.exit(1);"
          echo "vercel.json configuration syntax is valid."
