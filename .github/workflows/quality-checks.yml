name: Quality Checks & Automated Audits

on:
  push:
    branches: [ update, develop ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Code Quality & Integrity Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests
        run: node --test tests/unit/*.test.js

      - name: Run HTML & Asset Integrity Audit
        run: node tests/integration/html-integrity.test.js

      - name: Run Server Route Probe
        run: node tests/integration/server-probe.js

      - name: Secret & Credential Scan
        run: |
          echo "Scanning for accidental credential exposure..."
          P_GCP="AIza""Sy"
          P_RSA="BEGIN ""PRIVATE KEY"
          P_AWS="AK""IA"
          if grep -rnw --exclude-dir={.git,.github,backup,node_modules} . -e "$P_GCP" -e "$P_RSA" -e "$P_AWS"; then
            echo "::error::Potential secret detected in tracked files!"
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Production Readiness Verification
        run: node -e "console.log('Static application validation completed successfully.')"
