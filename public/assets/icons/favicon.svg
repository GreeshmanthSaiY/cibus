<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radiant Saffron & Gold Radial Gradient -->
    <radialGradient id="saffronGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="60%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#8E0000" />
    </radialGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FBC02D" />
      <stop offset="70%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Handi Metallic Brass Gradient -->
    <linearGradient id="brassHandi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Fresh Mint Herb Gradient -->
    <linearGradient id="mintGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Glowing Steam Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Plate with Golden Border -->
  <circle cx="32" cy="32" r="30" fill="url(#saffronGlow)" stroke="url(#goldRim)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FFE082" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.8" />

  <!-- Aromatic Rising Steam Ribbons -->
  <g filter="url(#glow)">
    <path d="M25 20 c-1.5 -3 1 -6 2 -9" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M32 18 c-1.5 -4 1.5 -7 2 -10" fill="none" stroke="#FFF9C4" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M39 20 c1.5 -3 -1 -6 -2 -9" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

    <!-- Traditional Indian Handi Pot -->
    <!-- Handi Rim -->
    <ellipse cx="32" cy="27" rx="17" ry="4.5" fill="url(#goldRim)" stroke="#5D4037" stroke-width="0.5"/>
    <!-- Curry Gravy Core Inside Pot -->
    <ellipse cx="32" cy="27" rx="14.5" ry="3.2" fill="#E65100"/>

    <!-- Handi Pot Belly -->
    <path d="M15 28 C 14.5 42, 21 51, 32 51 C 43 51, 49.5 42, 49 28 Z" fill="url(#brassHandi)" stroke="#FF6F00" stroke-width="0.8"/>

    <!-- Embossed Decorative Golden Belt around Handi -->
    <path d="M17 36 C 22 41, 42 41, 47 36" fill="none" stroke="#FFF9C4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="42" r="2" fill="#FFF9C4" />
    <circle cx="26" cy="40.5" r="1.4" fill="#FFE082" />
    <circle cx="38" cy="40.5" r="1.4" fill="#FFE082" />

    <!-- Fresh Mint / Coriander Herb Leaves Atop Dish -->
    <path d="M32 25 C 29 20, 25 21, 25 24 C 28 26, 31 26, 32 25 Z" fill="url(#mintGreen)" stroke="#004D40" stroke-width="0.4"/>
    <path d="M32 25 C 35 20, 39 21, 39 24 C 36 26, 33 26, 32 25 Z" fill="url(#mintGreen)" stroke="#004D40" stroke-width="0.4"/>
    <circle cx="32" cy="26" r="1.5" fill="#FF1744" />
  </g>
</svg>