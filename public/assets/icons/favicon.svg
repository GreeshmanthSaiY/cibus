<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Saffron Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%" fx="48%" fy="32%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="35%" stop-color="#FF8F00" />
      <stop offset="70%" stop-color="#E65100" />
      <stop offset="92%" stop-color="#BF360C" />
      <stop offset="100%" stop-color="#871C00" />
    </radialGradient>

    <!-- Outer 24K Polished Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="75%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#B26A00" />
    </linearGradient>

    <!-- Inner Gold Ring -->
    <linearGradient id="innerGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#8D4600" />
    </linearGradient>

    <!-- Cloche Dome Ivory-Gold Lustre -->
    <linearGradient id="clocheGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFF8E7" />
      <stop offset="70%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Ruby Jewel Finial -->
    <radialGradient id="rubyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="40%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#4A0000" />
    </radialGradient>

    <!-- Platter Gold -->
    <linearGradient id="platterGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="20%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="80%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3E1100" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Medallion with Outer Gold Bevel -->
  <circle cx="256" cy="256" r="246" fill="url(#goldRim)" filter="url(#dropGlow)" />
  <circle cx="256" cy="256" r="228" fill="url(#innerGold)" />
  <circle cx="256" cy="256" r="216" fill="url(#bgGrad)" />

  <!-- Subtle Sunburst Ray Flares in Saffron Base -->
  <g opacity="0.18" stroke="#FFF9C4" stroke-width="2.5">
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
    <line x1="108" y1="108" x2="404" y2="404" />
    <line x1="404" y1="108" x2="108" y2="404" />
  </g>

  <!-- Aromatic Steam Swirls (Warm Glowing White) -->
  <g fill="none" stroke-linecap="round" opacity="0.95" filter="url(#softShadow)">
    <!-- Left Steam -->
    <path d="M220 156 C206 134, 210 114, 226 96 C238 82, 240 66, 232 48" stroke-width="15" stroke="url(#clocheGrad)" />
    <!-- Center Main Steam -->
    <path d="M256 145 C270 120, 268 96, 252 76 C240 58, 244 42, 256 26" stroke-width="18" stroke="#FFFFFF" />
    <!-- Right Steam -->
    <path d="M292 156 C306 134, 302 114, 286 96 C274 82, 272 66, 280 48" stroke-width="15" stroke="url(#clocheGrad)" />
  </g>

  <!-- Finial Jewel Crown -->
  <circle cx="256" cy="176" r="24" fill="url(#goldRim)" filter="url(#softShadow)" />
  <circle cx="256" cy="176" r="16" fill="url(#rubyGrad)" />
  <circle cx="251" cy="171" r="5" fill="#FFFFFF" opacity="0.85" />

  <!-- Cloche Dome (Curved Serving Cover) -->
  <path d="M112 336 C112 224, 178 184, 256 184 C334 184, 400 224, 400 336 Z" 
        fill="url(#clocheGrad)" 
        stroke="url(#goldRim)" 
        stroke-width="8" 
        filter="url(#dropGlow)" />

  <!-- Specular 3D Highlight on Cloche -->
  <path d="M136 328 C136 242, 188 198, 246 192 C208 200, 156 244, 154 328 Z" 
        fill="#FFFFFF" 
        opacity="0.7" />

  <!-- Regal Sculpted CIBUS 'C' Monogram on Cloche -->
  <g filter="url(#softShadow)">
    <path d="M288 240 C280 234, 270 230, 255 230 C229 230, 212 249, 212 276 C212 303, 229 322, 255 322 C270 322, 280 318, 288 312 L297 325 C285 335, 271 340, 253 340 C216 340, 193 313, 193 276 C193 239, 216 212, 253 212 C271 212, 286 217, 297 227 Z" 
          fill="#6A1A04" />
    <path d="M285 243 C278 237, 269 234, 255 234 C232 234, 216 251, 216 276 C216 301, 232 318, 255 318 C269 318, 278 315, 286 309 L292 320 C282 329, 270 334, 253 334 C220 334, 198 310, 198 276 C198 242, 220 218, 253 218 C270 218, 282 223, 292 232 Z" 
          fill="#A82800" />
  </g>

  <!-- Cloche Lower Accent Band -->
  <path d="M112 332 L400 332 L400 345 L112 345 Z" fill="url(#goldRim)" />

  <!-- Royal Serving Platter (Tray Base) -->
  <path d="M72 348 C72 342, 88 338, 108 338 L404 338 C424 338, 440 342, 440 348 C440 364, 400 375, 256 375 C112 375, 72 364, 72 348 Z" 
        fill="url(#platterGrad)" 
        stroke="url(#goldRim)" 
        stroke-width="5" 
        filter="url(#softShadow)" />

  <!-- Platter Edge Highlights -->
  <ellipse cx="256" cy="350" rx="174" ry="6" fill="#FFFFFF" opacity="0.45" />

  <!-- Platter Jewel Accents -->
  <circle cx="256" cy="359" r="7" fill="url(#rubyGrad)" />
  <circle cx="176" cy="355" r="4.5" fill="#2E7D32" />
  <circle cx="336" cy="355" r="4.5" fill="#2E7D32" />

  <!-- Traditional Spices & Saffron Accents Underneath -->
  <g fill="#FFC107" opacity="0.95">
    <circle cx="218" cy="392" r="5" fill="#FFD54F" />
    <circle cx="256" cy="399" r="7.5" fill="#FFA000" />
    <circle cx="294" cy="392" r="5" fill="#FFD54F" />
    <!-- Saffron Strands -->
    <path d="M234 388 Q245 395 252 386" stroke="#D50000" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M260 386 Q268 396 278 388" stroke="#D50000" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
</svg>